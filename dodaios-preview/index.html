<style>

<div class="trace-step demo-phase" data-phase="2"><div data-trace-tool="approval" data-state="approval"><button class="group/trace flex w-full min-w-0 items-start gap-3 rounded-md py-1 text-left text-sm leading-6 text-foreground"><span class="trace-node"><svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3 20 7v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7zM9 12l2 2 4-4"/></svg></span><span class="min-w-0 flex-1"><span data-cn="AI 分析中" data-en="AI is analyzing">AI 分析中</span><span class="ml-2 font-mono text-xs text-muted-foreground" data-cn="检查修改范围与风险" data-en="Review changes and risks">检查修改范围与风险</span></span></button><div class="demo-approval space-y-2 text-sm"><p data-cn="发现构建问题，准备修复。确认后继续。" data-en="Build issue found. Ready to fix after your approval.">发现构建问题，准备修复。确认后继续。</p><div class="flex flex-wrap items-center gap-2"><button class="rounded-md bg-primary px-3 py-1.5 text-xs text-primary-foreground" data-demo-allow data-cn="允许" data-en="Allow">允许</button><button class="rounded-md border border-border px-3 py-1.5 text-xs text-foreground" data-demo-decline data-cn="拒绝" data-en="Decline">拒绝</button><span class="demo-approval-result" data-approval-result aria-live="polite"></span></div></div></div></div>

</div></div></div>

<script>
(()=>{const view=document.getElementById('viewport'),root=document.getElementById('app-root'),side=document.getElementById('sidebar');const fit=()=>{const compact=view.clientWidth<680,w=compact?720:1015,s=view.clientWidth/w;root.style.width=w+'px';root.style.height=(view.clientHeight/s)+'px';root.style.transform=`scale(${s})`;side.style.width='240px';side.dataset.railed='false';document.querySelectorAll('.demo-recent,.demo-empty').forEach(e=>e.style.display='')};new ResizeObserver(fit).observe(view);fit();const q=new URLSearchParams(location.search);document.documentElement.lang=q.get('lang')==='en'?'en':'zh-CN';document.querySelectorAll('[data-cn][data-en]:not(.trace-step [data-cn]):not(.trace-step [data-en])').forEach(e=>e.textContent=document.documentElement.lang==='en'?e.dataset.en:e.dataset.cn);root.dataset.showcasePhase='4'})();
</script><script src="./views.js?v=19"></script></body></html>
